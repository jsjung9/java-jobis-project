spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:jobis;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      dialect: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret
          naver:
            client-id: test-client
            client-secret: test-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
          kakao:
            client-id: test-client
            client-secret: test-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: test-jwt-secret-key-must-be-at-least-32-bytes-long
  access-expired: 1800000
  refresh-expired: 1209600000

cors:
  allowedOrigins: http://localhost:3000

oauth2:
  authorized-redirect-origins: http://localhost:3000

services:
  news-base-url: http://localhost:8000

logging:
  level:
    org.hibernate.SQL: warn
